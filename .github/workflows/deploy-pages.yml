name: Deploy to GitHub Pages (Static Preview)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Create Static Public Index
        run: |
          mkdir -p out
          cp -r public/* out/ 2>/dev/null || true
          cat << 'EOF' > out/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>TribalScholar AI — Scheme & Document Intelligence</title>
            <script src="https://cdn.tailwindcss.com"></script>
          </head>
          <body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-6">
            <div class="max-w-2xl w-full bg-slate-800 rounded-2xl border border-slate-700 p-8 shadow-2xl space-y-6">
              <div class="flex items-center gap-3 border-b border-slate-700 pb-4">
                <span class="text-3xl">🏛️</span>
                <div>
                  <h1 class="text-2xl font-bold text-white">TribalScholar AI Case Management</h1>
                  <p class="text-xs text-slate-400">Smart India Hackathon 2024 — Ministry of Tribal Affairs (SIH 239)</p>
                </div>
              </div>

              <div class="space-y-3 text-sm text-slate-300">
                <p>This GitHub Pages deployment serves as the public project overview. The live platform requires a full-stack runtime with PostgreSQL 17, NextAuth session authentication, and a real Tesseract OCR intelligence pipeline.</p>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2">
                <div class="rounded-lg bg-slate-900/80 border border-slate-700 p-4 space-y-1">
                  <div class="text-xs font-bold text-emerald-400 uppercase tracking-wider">📦 Full Source Code</div>
                  <div class="text-xs text-slate-400">Complete Next.js 14, Prisma, PostgreSQL backend repository</div>
                  <a href="https://github.com/shreypatell13/SIH_239" target="_blank" class="inline-block mt-2 text-xs font-semibold text-blue-400 hover:underline">View on GitHub →</a>
                </div>
                <div class="rounded-lg bg-slate-900/80 border border-slate-700 p-4 space-y-1">
                  <div class="text-xs font-bold text-amber-400 uppercase tracking-wider">⚡ Features Included</div>
                  <div class="text-xs text-slate-400">Real OCR, Bounding Boxes, Mismatch Detection, Deficiencies</div>
                </div>
              </div>
            </div>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
